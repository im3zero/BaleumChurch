<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발음교회 vip 초청 주일 초대장</title>
    <meta property="og:title" content="발음교회 VIP 초청주일 모바일 초대장">
    <meta property="og:description" content="친구야~ 교회 가자!">
    <meta property="og:url" content="https://baleum-church.vercel.app">
    <meta property="og:image" content="https://baleum-church.vercel.app/카카오톡_미리보기_포스터.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600&display=swap">
    <style>
        :root {
            --bg: #F8F5EF; --surface: #FFFFFF; --gold: #C9A84C; --gold-light: #E8D5A0;
            --text-primary: #1B2A4A; --text-secondary: #6B7280;
            --border: rgba(27, 42, 74, 0.10); --shadow: 0 2px 16px rgba(27, 42, 74, 0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1A2E; --surface: #1A2840; --gold: #C9A84C;
                --gold-light: rgba(201, 168, 76, 0.15); --text-primary: #EDE8DF;
                --text-secondary: #9CA3AF; --border: rgba(232, 213, 160, 0.12);
                --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
            }
        }
        :root[data-theme="dark"] {
            --bg: #0F1A2E; --surface: #1A2840; --gold: #C9A84C;
            --gold-light: rgba(201, 168, 76, 0.15); --text-primary: #EDE8DF;
            --text-secondary: #9CA3AF; --border: rgba(232, 213, 160, 0.12);
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif; min-height: 100%;
            display: flex; justify-content: center;
            padding-inline: 16px; padding-block: 48px 64px;
        }
        .page { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
        .header { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 0 40px; text-align: center; }
        .church-name { font-family: 'Jua', sans-serif; font-size: 34px; font-weight: 400; color: var(--text-primary); letter-spacing: -0.02em; }
        h2 { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 600; color: var(--text-secondary); }
        .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .link-card {
            display: flex; align-items: center; gap: 16px; padding: 18px 20px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease; position: relative; overflow: hidden;
        }
        .link-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--gold); border-radius: 0 2px 2px 0; opacity: 0; transition: opacity 0.15s ease;
        }
        .link-card:active { transform: scale(0.97); box-shadow: 0 1px 6px rgba(27,42,74,0.08); }
        .link-card:active::before { opacity: 1; }
        .icon-wrap { width: 44px; height: 44px; border-radius: 12px; background: var(--gold-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-wrap svg { width: 22px; height: 22px; fill: var(--gold); }
        .link-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .link-label { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
        .link-desc { font-size: 12px; color: var(--text-secondary); }
        .arrow { color: var(--text-secondary); opacity: 0.5; flex-shrink: 0; transition: transform 0.2s ease; }

        /* 인스타 드롭다운 */
        .insta-wrap { display: flex; flex-direction: column; }
        .insta-toggle { cursor: pointer; user-select: none; transition: border-radius 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease; }
        .insta-toggle.open { border-radius: 16px 16px 0 0; }
        .insta-toggle.open .arrow { transform: rotate(90deg); }
        .insta-dropdown { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; border: 1px solid var(--border); border-top: none; border-radius: 0 0 16px 16px; background: var(--surface); box-shadow: var(--shadow); }
        .insta-dropdown.open { max-height: 500px; }
        .insta-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; text-decoration: none; color: var(--text-primary); font-size: 14px; font-weight: 500; border-top: 1px solid var(--border); transition: background 0.1s ease; }
        .insta-item:active { background: var(--gold-light); }
        .insta-item:last-child { border-radius: 0 0 16px 16px; }
        .insta-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

        .day-num { font-size: 11px; font-weight: 500; text-align: center; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto; }
    </style>
</head>
<body>
<div class="page">
    <header class="header">

    <nav class="links" aria-label="교회 링크 모음">

            <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a href="https://www.youtube.com/@baleumchurch" class="link-card" target="_blank" rel="noopener">
            <div class="icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.97C18.88 4 12 4 12 4s-6.88 0-8.59.45A2.78 2.78 0 001.46 6.42 29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.95 1.97C5.12 20 12 20 12 20s6.88 0 8.59-.45a2.78 2.78 0 001.95-1.97A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="var(--surface)"/></svg>
            </div>
            <div class="link-info"><span class="link-label">유튜브</span><span class="link-desc">설교 및 예배 영상</span></div>
            <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <div class="insta-wrap">
            <div class="link-card insta-toggle" onclick="toggleDropdown(this)">
                <div class="icon-wrap">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4" fill="var(--surface)"/><circle cx="17.5" cy="6.5" r="1.2" fill="var(--surface)"/></svg>
                </div>
                <div class="link-info"><span class="link-label">인스타그램</span><span class="link-desc">인스타그램 둘러보기</span></div>
                <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div class="insta-dropdown">
                <a href="https://www.instagram.com/keunyeongjeon/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>담임목사님</a>
                <a href="https://www.instagram.com/baleum_church/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>발음교회</a>
                <a href="https://www.instagram.com/baleum_1cheong/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>1청년부</a>
                <a href="https://www.instagram.com/baleum_2cheong/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>2청년부</a>
                <a href="https://www.instagram.com/baleum_highschool/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>고등부</a>
                <a href="https://www.instagram.com/baleum_middleschool/" class="insta-item" target="_blank" rel="noopener"><span class="insta-dot"></span>중등부</a>
            </div>
        </div>

        <a href="https://naver.me/FdCfiIFa" class="link-card" target="_blank" rel="noopener">
            <div class="icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="var(--surface)"/></svg>
            </div>
            <div class="link-info"><span class="link-label">오시는 길</span><span class="link-desc">네이버 지도로 보기</span></div>
            <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </a>

    </nav>

    <img src="/logo.png" style="width:200px; margin-top:40px; mix-blend-mode:multiply; opacity:0.8;" alt="발음교회 로고">
</div>

<script>
    function toggleDropdown(btn) {
        const dropdown = btn.nextElementSibling;
        const isOpen = btn.classList.contains('open');
        document.querySelectorAll('.insta-toggle').forEach(b => {
            b.classList.remove('open');
            b.nextElementSibling.classList.remove('open');
        });
        if (!isOpen) {
            btn.classList.add('open');
            dropdown.classList.add('open');
        }
    }

</script>
